<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kitabu cha Wageni</title>
  <meta name="description" content="Offline guestbook and feedback assistant for a small coffee-farm tour operator. Swahili first.">
  <meta name="theme-color" content="#24533F">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/src/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/icons/icon.svg" alt="" width="32" height="32">
      <div>
        <div class="brand-name">Kitabu cha Wageni</div>
        <div class="brand-sub en">Guestbook assistant · works offline</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="net" class="net" aria-live="polite"></span>
      <button class="icon-btn" data-action="toggle-en" aria-label="Show or hide English">EN</button>
      <button class="icon-btn" data-action="go" data-tab="more" aria-label="More">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <button data-action="go" data-tab="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Wiki ijayo</span><span class="en">Next week</span>
    </button>
    <button data-action="go" data-tab="add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Ongeza maoni</span><span class="en">Add feedback</span>
    </button>
    <button data-action="go" data-tab="summary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      <span>Muhtasari</span><span class="en">Summary</span>
    </button>
    <button data-action="go" data-tab="guests">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/></svg>
      <span>Wageni</span><span class="en">Guests</span>
    </button>
    <button data-action="go" data-tab="langs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 5.5 5 7M11 5c-.6 3.4-3 6.5-7 8"/><path d="M12 21l4.5-10L21 21M13.6 17.5h5.8"/></svg>
      <span>Lugha</span><span class="en">Languages</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Tafadhali washa JavaScript. Please enable JavaScript.</noscript>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
